[package]
name = "dysonsphere"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
chrono = { version = "0.4.40", features = ["serde"] }
tokio = { version = "1.44.2", features = ["macros", "rt-multi-thread", "sync"] }
async-trait = "0.1"
lapin = { version = "2.3.0", default-features = false, features = [] }
futures-util = "0.3.31"
fs2 = "0.4"

