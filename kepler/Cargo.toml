[package]
name = "kepler"
version = "0.1.0"
edition = "2021"

[dependencies]
dysonsphere = { path = "../dysonsphere" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process"] }
log = "0.4"
env_logger = "0.11"
dotenvy = "0.15"

[dev-dependencies]
serde_json = "1"
chrono = { version = "0.4.40", features = ["serde"] }
