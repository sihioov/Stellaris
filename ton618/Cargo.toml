[package]
name = "ton618"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1.88"
anyhow = "1.0.97"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.44.2", features = ["time", "macros", "rt", "rt-multi-thread"] }
env_logger = "0.11.8"
log = "0.4.27"
chrono = "0.4.40"
cron = { version = "0.15.0", optional = true }
dysonsphere = { path = "../dysonsphere" }
dotenvy = "0.15"

[features]
default = ["file-dispatch"]
file-dispatch = []
rabbitmq-dispatch = []
scheduler-cron = ["dep:cron"]
rdb = []
nosql = []
