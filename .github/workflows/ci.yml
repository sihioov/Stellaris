name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    name: Rust (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: default
            args: ""
          - profile: all-features
            args: "--all-features"
          - profile: no-default-features
            args: "--no-default-features"
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build workspace
        run: cargo build --workspace ${{ matrix.args }}

      - name: Test workspace
        run: cargo test --workspace ${{ matrix.args }}

      - name: Clippy workspace
        run: cargo clippy --workspace --all-targets ${{ matrix.args }} -- -D warnings

      - name: Build ton618 file-dispatch without defaults
        if: matrix.profile == 'no-default-features'
        run: cargo build -p ton618 --no-default-features --features file-dispatch

      - name: Test ton618 file-dispatch without defaults
        if: matrix.profile == 'no-default-features'
        run: cargo test -p ton618 --no-default-features --features file-dispatch

  discord-bot:
    name: Europa checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile Discord bot
        run: python3 -m py_compile apps/europa/bot.py

      - name: Run Discord bot config tests
        run: python3 -m unittest apps/europa/test_bot_config.py
