name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Rust workspace and Discord bot checks
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Rust tests
        run: cargo test --workspace

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Compile Discord bot
        run: python3 -m py_compile apps/discord-bot/bot.py

      - name: Run Discord bot config tests
        run: python3 -m unittest apps/discord-bot/test_bot_config.py
